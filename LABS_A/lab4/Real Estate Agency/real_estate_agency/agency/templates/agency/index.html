{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Properties</title>

    <link rel="stylesheet" href="{% static 'agency/bootstrap.css' %}"/>
    <script src="{% static 'agency/bootstrap.bundle.js' %}"></script>

</head>
<body>
<nav class="navbar navbar-expand-lg" style="background-color: #2b7a4a;">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <h3 class="m-3 text-white">NestFind</h3>
        <p class="m-3 text-white-50">REAL ESTATE LISTINGS</p>
    </div>
</nav>
<div class="container-fluid p-4" style="background-color: #23673f; color:white;">
    <h1 class="">All Properties</h1>
    <p class="text-white- badge rounded-pill bg-dark">
        {{ properties|length }} listings available
    </p>
</div>
<div class="container mt-4">

    <div class="row">

        {% for property in properties %}

        <div class="col-md-4 mb-4">

            <div class="card h-100 shadow">

                <img src="{{ property.image.url }}"
                     class="card-img-top"
                     style="height:250px; object-fit:cover;">

                <div class="card-body text-lg-start">
                    <h6 class="text-success">{{ property.property_type }}</h6>
                    <h6>{{ property.title }}</h6>
                    <h6 class="text-black-50">{{ property.location }}</h6>
                    <hr>

                    <div class="d-flex justify-content-between align-items-center">
                        <p class="fw-bold text-success mt-1 ">
                            {{ property.price }} €
                        </p>
                        <p class="badge rounded-pill bg-dark mt-1">{{ property.status }}</p>
                    </div>

                    <a href="/details/{{ property.id }}/"
                       class="btn btn-dark">
                        Details
                    </a>

                </div>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

</body>
</html>
